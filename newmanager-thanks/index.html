    <style>
      :root {
        --ink: #090909;
        --muted: #5c5c5c;
        --orange: #ff3b30;
        --orange-dark: #e52219;
        --orange-soft: #ffe5e2;
        --line: rgba(9, 9, 9, 0.14);
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100svh;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 15%, rgba(255, 59, 48, 0.12), transparent 26%),
          radial-gradient(circle at 88% 85%, rgba(255, 59, 48, 0.1), transparent 28%),
          #ffffff;
      }

      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .success-card {
        position: relative;
        isolation: isolate;
        width: min(780px, 100%);
        overflow: hidden;
        padding: clamp(34px, 7vw, 76px);
        border: 1px solid var(--line);
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 30px 90px rgba(9, 9, 9, 0.14);
        text-align: center;
      }

      .success-card::before,
      .success-card::after {
        content: "";
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        background: var(--orange-soft);
      }

      .success-card::before { width: 270px; height: 270px; top: -180px; right: -90px; }
      .success-card::after { width: 190px; height: 190px; bottom: -130px; left: -70px; }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 38px;
        font-size: 16px;
        font-weight: 950;
        letter-spacing: 0.04em;
      }

      .brand::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 0 7px var(--orange-soft);
      }

      .check {
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: var(--orange);
        color: white;
        box-shadow: 0 18px 42px rgba(255, 59, 48, 0.3), 0 0 0 14px var(--orange-soft);
        font-size: 48px;
        font-weight: 950;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(46px, 9vw, 82px);
        line-height: 0.96;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }

      .accent { color: var(--orange); }

      p {
        max-width: 590px;
        margin: 28px auto 0;
        color: var(--muted);
        font-size: clamp(18px, 2.7vw, 24px);
        line-height: 1.5;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(430px, 100%);
        min-height: 68px;
        margin-top: 38px;
        padding: 16px 28px;
        border-radius: 999px;
        background: var(--orange);
        color: white;
        font-size: 18px;
        font-weight: 900;
        text-decoration: none;
        text-transform: uppercase;
        box-shadow: 0 16px 36px rgba(255, 59, 48, 0.28);
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        background: var(--orange-dark);
        box-shadow: 0 21px 44px rgba(255, 59, 48, 0.34);
      }

      .button:focus-visible { outline: 4px solid rgba(255, 59, 48, 0.24); outline-offset: 5px; }

      .note {
        margin-top: 18px;
        color: #777;
        font-size: 15px;
      }

      @media (max-width: 560px) {
        main { padding: 18px 14px; }
        .success-card { padding: 34px 20px 38px; border-radius: 28px; }
        .brand { margin-bottom: 30px; }
        .check { width: 76px; height: 76px; font-size: 40px; }
        .button { min-height: 62px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="success-card" aria-labelledby="success-title">
        <div class="brand">VENHER · EDU</div>
        <div class="check" aria-hidden="true">✓</div>
        <h1 id="success-title">Оплата <span class="accent">успішна!</span></h1>
        <p>Щоб отримати доступ до мінікурсу, натисніть кнопку нижче.</p>
        <a class="button" href="https://telegram.me/Olga_Venher_bot?start=ZGw6MzQ4MzI2">Отримати доступ</a>
        <div class="note">Після натискання відкриється Telegram-бот із матеріалами курсу.</div>
      </section>
    </main>
  </body>
</html>
