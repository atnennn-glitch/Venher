    <style>
      :root {
        color-scheme: light;
        --paper: #f8f7f2;
        --ink: #1e1830;
        --muted: #565064;
        --line: #dcd8e0;
        --violet: #5232d9;
        --lime: #d9f976;
        color: var(--ink);
        background: var(--paper);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; }

      main {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      .success-card {
        width: min(100%, 46rem);
        padding: clamp(2rem, 7vw, 4.5rem) clamp(1rem, 5vw, 4rem);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fffdfa;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        margin-bottom: 1.75rem;
        font-size: 1.15rem;
        font-weight: 850;
        letter-spacing: -.055em;
      }

      .brand-dot { color: var(--violet); }

      .brand-icon {
        display: flex;
        align-items: end;
        gap: 2px;
        margin-right: 8px;
        color: var(--violet);
        transform: skew(-16deg);
      }

      .brand-icon i {
        width: 3px;
        height: 9px;
        border-radius: 2px;
        background: currentColor;
      }

      .brand-icon i:nth-child(2) { height: 13px; }
      .brand-icon i:nth-child(3) { height: 17px; }

      .check {
        display: grid;
        place-items: center;
        width: 3.5rem;
        aspect-ratio: 1;
        margin: 0 auto 1.25rem;
        border-radius: 8px;
        background: var(--lime);
        font-size: 1.8rem;
        font-weight: 800;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.75rem);
        font-weight: 850;
        line-height: .94;
        letter-spacing: -.075em;
      }

      .accent { display: block; color: var(--violet); }

      p {
        max-width: 27rem;
        margin: 1.25rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        text-wrap: pretty;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        margin-top: 1.5rem;
        padding: .8rem 1.45rem;
        border-radius: 8px;
        background: var(--violet);
        color: #fff;
        font-weight: 750;
        text-decoration: none;
        transition: background-color .18s ease;
      }

      .button:hover { background: #3c21ad; }
      .button:focus-visible { outline: 3px solid #7251ff; outline-offset: 4px; }

      @media (max-width: 480px) {
        .button { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1280398327139709&amp;ev=PageView&amp;noscript=1" alt="" /></noscript>
    <main>
      <section class="success-card" aria-labelledby="success-title">
        <div class="brand"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>VENHER<span class="brand-dot">.</span>EDU</div>
        <div class="check" aria-hidden="true">✓</div>
        <h1 id="success-title">Оплата <span class="accent">успішна!</span></h1>
        <p>Матеріали мінікурсу чекають на вас у Telegram.</p>
        <a class="button" href="https://telegram.me/Olga_Venher_bot?start=ZGw6MzQ4OTk1">Отримати доступ</a>
      </section>
    </main>
  </body>
</html>
