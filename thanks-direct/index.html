  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:

    .success {

      border: 1px solid rgba(255, 255, 255, .16);

      box-shadow: 0 30px 90px rgba(0, 0, 0, .5);
      text-align: center;
      isolation: isolate;
    }
    .success::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(102, 185, 79, .12), transparent 42%);
    }
    .success__icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #61aa4d;
      box-shadow: 0 14px 40px rgba(83, 163, 65, .38);
      color: #fff;
      font-size: 38px;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 78px);
      line-height: .98;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }
    p {
      max-width: 640px;
      margin: 28px auto 38px;
      color: #c9c5be;
      font-size: clamp(18px, 2.6vw, 24px);
      line-height: 1.45;
    }
    .access-button {

      justify-content: center;
      width: min(430px, 100%);
      min-height: 66px;
      padding: 18px 30px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: linear-gradient(135deg, #70c258, #4d963e);
      box-shadow: 0 16px 44px rgba(67, 144, 55, .42);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .access-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 52px rgba(67, 144, 55, .56);
    }
    .access-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
    @media (max-width: 560px) {
      .success { border-radius: 22px; }
