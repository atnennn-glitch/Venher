*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-size:16px;line-height:1.55}h1,p{margin:0}h1{font-weight:850;letter-spacing:-.05em}em{font-style:normal;color:var(--accent)}

.thanks-mark{width:76px;height:76px;margin:0 auto 28px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#0a110b;font-size:42px;font-weight:900;box-shadow:0 16px 46px rgba(156,231,107,.2)}

.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:17px 28px;border:1px solid transparent;border-radius:999px;background:var(--accent);color:#0a110b;box-shadow:0 16px 42px rgba(156,231,107,.12);text-align:center;text-decoration:none;text-transform:uppercase;font-size:16px;line-height:1.35;font-weight:850;transition:background .18s,transform .18s,box-shadow .18s}
.button:hover{background:#b5f18d;transform:translateY(-2px);box-shadow:0 18px 45px rgba(156,231,107,.2)}
.button:focus-visible{outline:3px solid #b5f18d;outline-offset:5px}
.thanks-button{max-width:570px;margin:34px auto 0}
.thanks-note{max-width:590px;margin:18px auto 0;color:#9fac9b;font-size:14px;line-height:1.5}
@media(max-width:700px){.thanks-main{padding:18px}.thanks-card{padding:42px 20px 34px;border-radius:24px}.thanks-mark{width:64px;height:64px;margin-bottom:22px;font-size:34px}.thanks-kicker{font-size:12px}.thanks-card h1{font-size:clamp(34px,10vw,46px)}.thanks-copy{margin-top:22px;font-size:17px}.thanks-button{margin-top:28px;padding-inline:16px;font-size:14px}.thanks-note{font-size:13px}}
